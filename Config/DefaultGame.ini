; m4u: the phone layout (Hud/PYRPhoneLayout). The stream is always 16:9, so the game can't see a phone from its size:
; until the stream page says whether touch is on (a PYRTouch message), a streamed game assumes it is, on a phone of
; this size, and keeps its UI clear of the page's controls. -NoTouchLayout or pyr.TouchLayout 2 turns that off.
[PYRPhoneLayout]
TouchWhenStreamed=True
AssumedPageWidth=844
AssumedPageHeight=390
